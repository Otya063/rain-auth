# Node.js compatibility: https://developers.cloudflare.com/workers/runtime-apis/nodejs/
compatibility_date = "2026-07-03"
workers_dev = false
compatibility_flags = [ "nodejs_compat" ]
logpush = false

main = ".svelte-kit/cloudflare/_worker.js"

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[placement]
mode = "smart"

# vars / bindings are NOT inherited between environments,
# so each [env.*] block below must fully redeclare its own bindings.

[env.development]
name = "auth_dev"

[env.development.vars]
MAINTENANCE_MODE = "false"
MAINTENANCE_DATE = ""

[[env.development.hyperdrive]]
binding = "HYPERDRIVE"
id = "8da8e9b522234f9caaec0aa25e0827aa"

[env.production]
name = "auth"

[env.production.vars]
MAINTENANCE_MODE = "false"
MAINTENANCE_DATE = ""

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "688c3b61066846a1ae4a977b1c05d5b9"
