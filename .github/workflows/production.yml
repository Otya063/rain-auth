name: 'Rain Auth'
on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
        types:
            - opened
            - synchronize
            - closed

jobs:
    build-for-production:
        runs-on: ubuntu-latest
        env:
            ADMIN_CREDENTIALS: ${{ secrets.ADMIN_CREDENTIALS }}
            COOKIES_DOMAIN: ${{ secrets.COOKIES_DOMAIN }}
            PUBLIC_MAIN_DOMAIN: ${{ secrets.PROD_MAIN_DOMAIN }}
            PUBLIC_AUTH_DOMAIN: ${{ secrets.PROD_AUTH_DOMAIN }}
            DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
            DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
            DISCORD_CALLBACK_URI: ${{ secrets.PROD_DISCORD_CALLBACK_URI }}
            DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
            PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
            TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
            
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              id: pnpm-install
              with:
                  run_install: false

            - name: Install dependencies
              run: pnpm i

            - name: Build
              run: pnpm build

            - name: Deploy on Cloudflare Production
              if: github.event_name == 'push' || github.event.pull_request.merged || github.event_name == 'workflow_dispatch'
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CF_API_TOKEN }}
                  accountId: ${{ secrets.CF_ACCOUNT_ID }}
                  command: deploy --env production
